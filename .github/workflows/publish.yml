# Adapted from anthropics/rayon anthropic-1.13.3000 publish.yml (go/fork,
# go/artifactory-publish).
# Security notes:
# - GitHub-owned actions use tag pins, third-party actions use SHA pins
# - Only two external actions: actions/checkout (GitHub-owned) and
#   jfrog/setup-jfrog-cli (allowlisted, handles OIDC auth)
# - Rust toolchain uses the runner's pre-installed rustup
# - Publishing runs from the anthropic-0.7.0 release branch
name: Publish to Artifactory

on:
  push:
    branches:
      - anthropic-0.7.0

permissions:
  contents: read

jobs:
  # Publishing must never ship an untested build: this is the only workflow
  # that runs on pushes to the release branch, so it carries its own gate.
  # This line carries one change over upstream raft-proto 0.7.0: the crate
  # re-exports its protobuf runtime (`pub use protobuf;`), so a consumer
  # that encodes eraftpb messages names one protobuf major, this crate's.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup default stable
          rustup show

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Test raft-proto
        run: cargo test -p raft-proto

      - name: Test raft against the re-exporting proto crate
        run: cargo test -p raft

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup default stable
          rustup show

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup JFrog CLI
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@ff5cb544114ffc152db9cea1cd3d5978d5074946  # v4.5.11
        env:
          JF_URL: https://artifactory.infra.ant.dev
        with:
          oidc-provider-name: github
          oidc-audience: jfrog-github

      - name: Configure Cargo Registry
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [registries.crates-internal]
          index = "sparse+https://artifactory.infra.ant.dev/artifactory/api/cargo/crates-internal/index/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Publish raft-proto to Artifactory
        env:
          CARGO_REGISTRIES_CRATES_INTERNAL_TOKEN: "Bearer ${{ steps.setup-jfrog.outputs.oidc-token }}"
        run: |
          cd proto
          cargo publish --registry crates-internal --allow-dirty
