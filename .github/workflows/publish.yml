# Adapted from anthropics/rayon anthropic-1.13.3000 publish.yml.
# Packages raft-proto and uploads it with granary-upload.
# Security notes:
# - GitHub-owned actions use tag pins, third-party actions use SHA pins
# - One external action: actions/checkout (GitHub-owned)
# - Rust toolchain uses the runner's pre-installed rustup
# - Publishing runs from the anthropic-0.7.0 release branch
# - granary's publisher policy admits this upload only from this repository,
#   this workflow file, environment `publish` and this repository's release
#   branches, and only for raft-proto. Changing any of those needs the policy
#   changed first.
name: Publish to granary

on:
  push:
    branches:
      - anthropic-0.7.0

permissions:
  contents: read

jobs:
  # Publishing must never ship an untested build: this is the only workflow
  # that runs on pushes to the release branch, so it carries its own gate.
  # This line carries one change over upstream raft-proto 0.7.0: the crate
  # re-exports its protobuf runtime (`pub use protobuf;`), so a consumer
  # that encodes eraftpb messages names one protobuf major, this crate's.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup default stable
          rustup show

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Test raft-proto
        run: cargo test -p raft-proto

      - name: Test raft against the re-exporting proto crate
        run: cargo test -p raft

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup default stable
          rustup show

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install granary-upload
        # Fetches granary-upload, the publishing command, from the internal
        # registry with this job's own GitHub ID token, at the version and
        # sha256 pinned here. To move to a newer release, change the two
        # together.
        env:
          GRANARY_UPLOAD_VERSION: "0.2.0"
          GRANARY_UPLOAD_SHA256: "d940c308ea5ce021a7696a9b2761b4bb9b87e2796f6084bba36042e918cf614a"
        run: |
          set -euo pipefail
          jwt=$(curl -fsS --proto '=https' --retry 3 --retry-max-time 60 --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=granary-edge" | jq -er .value)
          echo "::add-mask::$jwt"
          mkdir -p "$RUNNER_TEMP/granary/bin"
          if ! curl -sSL --fail-with-body --proto '=https' --retry 3 --retry-max-time 300 --max-time 120 -H "Authorization: Bearer $jwt" \
            -o "$RUNNER_TEMP/granary/bin/granary-upload" \
            "https://granary.infra.ant.dev/files/granary-upload/v${GRANARY_UPLOAD_VERSION}/granary-upload-linux-amd64"; then
            echo "::error::could not download granary-upload ${GRANARY_UPLOAD_VERSION} from granary-edge. curl's error is above. Anything granary-edge answered follows."
            head -c 2000 "$RUNNER_TEMP/granary/bin/granary-upload" 2>/dev/null | tr -cd '[:print:]\n' || true
            exit 1
          fi
          echo "${GRANARY_UPLOAD_SHA256}  $RUNNER_TEMP/granary/bin/granary-upload" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/granary/bin/granary-upload"
          echo "$RUNNER_TEMP/granary/bin" >> "$GITHUB_PATH"

      # Builds and verifies the same .crate cargo publish would have uploaded,
      # into the workspace's target/package/. Packaging this one crate needs no
      # registry configured.
      - name: Package raft-proto
        run: |
          cd proto
          cargo package --allow-dirty

      # Reads the job's ID token itself (id-token: write above); the crate's
      # name and version come from the .crate file. If this step fails, re-run
      # the job. Re-running after a success re-packages the same version, which
      # is refused (exit 2) unless the bytes match.
      - name: Publish raft-proto to granary
        run: |
          set -euo pipefail
          granary-upload --issuer github --collection publish-github/cargo target/package/raft-proto-*.crate
